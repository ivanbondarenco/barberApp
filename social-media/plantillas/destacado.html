<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Destacado</title>
<link rel="stylesheet" href="marca.css">
<!--
  Tapas de historias destacadas y foto de perfil (1080 × 1080, se ven en círculo).
  ?icono=agenda|sena|precio|empezar|ayuda|clientes|perfil
  Íconos con el trazo de Lucide, los mismos de la app.
-->
<style>
  html, body { width: 1080px; height: 1080px; }
  .wrap { width: 1080px; height: 1080px; display: grid; place-items: center; background: var(--night); }
  .ring { width: 920px; height: 920px; border-radius: 50%; display: grid; place-items: center; background: var(--night-soft); border: 6px solid var(--night-line); }
  svg.i { width: 460px; height: 460px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .seal { width: 760px; height: 760px; }
</style>
</head>
<body>
<div class="wrap" id="w"></div>
<script>
  const ICONOS = {
    agenda: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
    sena: '<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20M6 15h4"/>',
    precio: '<path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.59-8.59a1 1 0 0 0 0-1.41Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    empezar: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    ayuda: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
    clientes: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    tijera: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
  };
  const k = new URLSearchParams(location.search).get("icono") || "agenda";
  document.getElementById("w").innerHTML = k === "perfil"
    ? '<img class="seal" src="../marca/logo-sello.svg" alt="BarberApp">'
    : `<div class="ring"><svg class="i" viewBox="0 0 24 24">${ICONOS[k] || ICONOS.agenda}</svg></div>`;
</script>
</body>
</html>
