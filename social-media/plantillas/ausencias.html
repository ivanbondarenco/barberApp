<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Ausencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<!-- Reglas de seña contra los que faltan. ?titulo= &pie= -->
<style>
  .stage { gap: 40px; justify-content: center; }
  .title { font-size: 88px; }
  .steps { display: flex; flex-direction: column; gap: 0; }
  .step { display: flex; gap: 32px; align-items: stretch; }
  .rail { display: flex; flex-direction: column; align-items: center; width: 96px; flex-shrink: 0; }
  .num { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; font-weight: 800; background: var(--primary-bright); }
  .line { flex: 1; width: 6px; border-radius: 3px; background: var(--night-line); margin: 12px 0; min-height: 40px; }
  .body { padding: 10px 0 48px; }
  .body b { display: block; font-size: 52px; letter-spacing: -0.03em; line-height: 1.1; }
  .body span { display: block; margin-top: 10px; font-size: 36px; color: var(--night-muted); line-height: 1.3; }
  .step.warn .num { background: var(--amber); color: var(--amber-ink); }
  .step.lock .num { background: var(--mint-glow); color: var(--night); }
  .foot { border-radius: 40px; background: var(--white); color: var(--ink); padding: 36px 44px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; animation-delay: 4.6s; }
  .foot span { color: var(--primary); }
</style>
</head>
<body>
<div class="stage">
  <div class="signature fade"><img src="../marca/logo-sello.svg" alt="">BarberApp</div>
  <h1 class="title" data-p="titulo" data-words data-start="100" data-step="130">¿Te dejaron *plantado* otra vez?</h1>
  <div class="steps">
    <div class="step rise" style="animation-delay:1.4s"><div class="rail"><div class="num">1</div><div class="line"></div></div>
      <div class="body"><b>Reserva con seña</b><span>La paga por Mercado Pago y entra directo a tu cuenta.</span></div></div>
    <div class="step warn rise" style="animation-delay:2.4s"><div class="rail"><div class="num">2</div><div class="line"></div></div>
      <div class="body"><b>Falta sin avisar</b><span>Pierde la seña. Tu tiempo no se regala.</span></div></div>
    <div class="step lock rise" style="animation-delay:3.4s"><div class="rail"><div class="num">✓</div></div>
      <div class="body"><b>Dos ausencias</b><span>Ya solo puede reservar pagando la seña por adelantado.</span></div></div>
  </div>
  <p class="foot rise" data-p="pie">Menos sillones vacíos. <span>Automático.</span></p>
</div>
<script src="plantilla.js"></script>
</body>
</html>
