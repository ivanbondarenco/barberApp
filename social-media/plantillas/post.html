<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<!--
  Diapositiva de carrusel (1080 × 1350, 4:5, PNG).
  ?tipo=tapa|punto|lista|cta &pag=2/6
   tapa:  &etiqueta= &titulo= &sub=
   punto: &icono= &num= &titulo= &texto= &chips=a|b
   lista: &etiqueta= &titulo= &items=a|b|c
   cta:   &titulo= &sub= &boton=
  La grilla del perfil recorta a 3:4 al centro: 34 px por lado. Todo vive con 96 px de margen.
-->
<style>
  html, body { height: 1350px; }
  .stage { height: 1350px; padding: 150px 96px 150px; justify-content: center; gap: 40px; }
  [class^="t-"], [class*=" t-"] { display: none; }
  body[data-tipo="tapa"] .t-tapa, body[data-tipo="punto"] .t-punto,
  body[data-tipo="lista"] .t-lista, body[data-tipo="cta"] .t-cta { display: flex; }
  .block { flex-direction: column; gap: 40px; }
  h1:empty, p:empty, span:empty, ul:empty { display: none !important; }

  .signature { top: auto; bottom: 72px; left: 96px; font-size: 28px; opacity: 0.8; }
  .signature img { width: 44px; height: 44px; }
  .pag { position: absolute; top: 76px; right: 96px; font-size: 26px; font-weight: 800; color: var(--night-muted); }
  .swipe { position: absolute; bottom: 72px; right: 96px; display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 800; color: var(--accent); }
  body:not([data-tipo="tapa"]) .swipe { display: none; }
  .swipe svg { width: 36px; height: 36px; }

  .display { font-size: 108px; }
  .title { font-size: 82px; }
  .text { font-size: 44px; line-height: 1.35; font-weight: 500; color: var(--night-muted); }
  .rule { width: 140px; height: 14px; border-radius: 99px; background: var(--primary-bright); }

  .head { display: flex; align-items: center; gap: 28px; }
  .ico { width: 156px; height: 156px; border-radius: 42px; background: var(--night-soft); border: 3px solid var(--night-line); color: var(--accent); display: grid; place-items: center; }
  .ico svg { width: 80px; height: 80px; }
  .num { font-size: 120px; font-weight: 800; letter-spacing: -0.05em; color: var(--night-line); line-height: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 14px; list-style: none; }
  .chips li { padding: 12px 26px; border-radius: 999px; background: rgb(110 231 183 / 0.14); color: var(--mint-glow); font-size: 30px; font-weight: 800; }
  .checks { list-style: none; display: flex; flex-direction: column; gap: 26px; }
  .checks li { display: flex; gap: 24px; align-items: center; font-size: 44px; font-weight: 700; line-height: 1.2; }
  .checks li::before { content: "✓"; flex-shrink: 0; width: 62px; height: 62px; border-radius: 50%; background: rgb(110 231 183 / 0.15); color: var(--mint-glow); display: grid; place-items: center; font-size: 32px; font-weight: 800; }

  .t-cta { align-items: center; text-align: center; }
  .t-cta .seal { width: 200px; height: 200px; }
  .cta { margin-top: 20px; }
</style>
</head>
<body data-tipo="tapa">
<div class="stage">
  <div class="block t-tapa">
    <div><span class="eyebrow" data-p="etiqueta"></span></div>
    <h1 class="display" data-p="titulo"></h1>
    <div class="rule"></div>
    <p class="text" data-p="sub"></p>
  </div>

  <div class="block t-punto">
    <div class="head"><div class="ico" data-icono></div><span class="num mono" data-p="num"></span></div>
    <h1 class="title" data-p="titulo"></h1>
    <p class="text" data-p="texto"></p>
    <ul class="chips" data-list="chips"></ul>
  </div>

  <div class="block t-lista">
    <div><span class="eyebrow" data-p="etiqueta"></span></div>
    <h1 class="title" data-p="titulo"></h1>
    <ul class="checks" data-list="items"></ul>
  </div>

  <div class="block t-cta">
    <img class="seal" src="../marca/logo-sello.svg" alt="">
    <h1 class="title" data-p="titulo">Probala <span class="accent">1 mes gratis</span></h1>
    <p class="text" data-p="sub">Sin tarjeta. Tu barbería lista hoy.</p>
    <div class="cta" data-p="boton">Link en la bio</div>
  </div>
</div>
<p class="pag mono" data-p="pag"></p>
<div class="swipe">Deslizá <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
<div class="signature"><img src="../marca/logo-sello.svg" alt="">BarberApp</div>
<script src="plantilla.js"></script>
</body>
</html>
